name: grounder
version: 0.9.4
requires_hermes: ">=0.22.3"
license: Apache-2.0
description: >-
  Better web routing for Hermes Agent. Grounder provider returns the results of the source for your question's topic.
  Grounder direct finds the source's page and reads it on your Mac with Safari. Reading a page named by address is free.
  A Grounder direct search is one search, at the one price, even if its page could not be read.
  Use /search (on Slack, /hermes search) to choose how to search, set the page format or pick a resolver. The search choice and format are saved on
  your Grounder account when connected. On macOS with Safari, install the reader as https://grounder.net/docs/direct shows.
  Use /search-login and /search-logout to manage site sign-ins. Cookies stay on your Mac. A connected account lists the site,
  Mac and save time. Grounder supports web_search, web_extract, grounder_search and grounder_list_topics. Installing selects
  Grounder for web search and extract only where no backend has been chosen. Search free without an account or connect one using
  hermes auth add grounder:grounder or GROUNDER_API_KEY. An optional x402 wallet can pay after the free searches are used.
  Search queries and hosted page addresses are sent to api.grounder.net. Usage context is off by default. For usage reporting, run hermes config set web.grounder.share_usage_context true and restart Hermes.
  This shares the model name and pseudonymous prompt and session identifiers.
author: Grounder
kind: backend
provides_tools:
  - grounder_search
  - grounder_list_topics
provides_hooks:
  - transform_tool_result
  - transform_llm_output
  - pre_tool_call
  - post_api_request  # registered only while web.grounder.share_usage_context is on (off unless set to true)
  - pre_llm_call
provides_web_providers:
  - grounder
optional_env:
  - name: GROUNDER_API_KEY
    description: "A Grounder search key: one way to connect your account, used ahead of the sign-in when set"
    url: "https://grounder.net/account/keys"
    secret: true
  - name: GROUNDER_OAUTH_CLIENT_ID
    description: "For the sign-in: Grounder's public client for Hermes, not a secret. The plugin sets it to https://api.grounder.net/oauth/clients/hermes-agent at its first load, so there is nothing to set unless you point the sign-in at another Grounder"
    url: "https://github.com/grounder-labs/grounder-hermes-plugin#by-signing-in"
  - name: GROUNDER_X402_PRIVATE_KEY
    description: "A wallet's private key, so the wallet pays for each search once Grounder's free searches are used up (x402). Off unless set. The plugin pays only USDC on Base, no more than GROUNDER_X402_MAX_PER_SEARCH a search, and signs with the eth-account package, which the Python that runs Hermes needs. Use a wallet that holds only what you are willing to spend"
    url: "https://github.com/grounder-labs/grounder-hermes-plugin#pay-per-search-with-a-wallet"
    secret: true
  - name: GROUNDER_X402_MAX_PER_SEARCH
    description: "The most one search may cost the wallet, in US dollars: a search that costs more is not paid. Defaults to 0.05"
    url: "https://github.com/grounder-labs/grounder-hermes-plugin#pay-per-search-with-a-wallet"
oauth:
  - id: grounder
    authorize_url: https://api.grounder.net/oauth/authorize
    token_url: https://api.grounder.net/oauth/token
    scopes: [search]
    client_id_env: GROUNDER_OAUTH_CLIENT_ID
    hosts: [api.grounder.net]
    authorize_params:
      resource: https://api.grounder.net/v1/search
