name: grounder
version: 0.7.0
requires_hermes: ">=0.22.3"
license: Apache-2.0
description: "Licensed, live sources for Hermes Agent's `web_search` and `web_extract`. One call reaches the search providers a query needs (Exa, Brave, Tavily, Perplexity and more) and live data for scores, prices, odds and flights, and returns one deduplicated list. Every result is licensed: no site's robots.txt, license or AI opt-out refuses the provider that found it, and a search is never filled with unlicensed results. Free searches need no account. Connect your account for more, with a Grounder search key in `GROUNDER_API_KEY` or by signing in with `hermes auth add grounder:grounder`, which Hermes stores and refreshes; a connected account can choose how Grounder searches with `/search` (on Slack, `/hermes search`) from Grounder's three modes: Grounder optimized (Grounder picks the provider for your question; the default), a Grounder preset (Fast, Cheap, Live, Deep, Code or Balanced: Grounder picks the best provider for it) or Grounder direct (you pick one provider, and optionally one of its modes: only that provider, and what it finds is what you get, even when that is nothing), and which live-data APIs may answer; `/search_presets` is the shortcut to the presets. Every mode returns what the provider returns, uncut and not reranked. A `web_extract` counts as one search and returns each page's text as Grounder returns it, whole and uncut by this plugin, read for the question of the search that found it, or your latest message when no search did. Installing makes Grounder this profile's `web_search` and `web_extract` backend the first time the plugin loads, replacing any backend already chosen for them once; `hermes tools` changes it back and that choice stands. Disclosure: each query and each page address you read is sent to api.grounder.net and recorded under your Grounder account, or with no account for a free search, and so is your latest message when a page no search found is read. `grounder_search` also sends the options the model chose, including a location or time zone only when the user stated one."
author: Grounder
kind: backend
provides_tools:
  - grounder_search
  - grounder_list_providers
provides_hooks:
  - transform_tool_result
  - transform_llm_output
  - pre_tool_call
  - post_api_request
  - pre_llm_call
provides_web_providers:
  - grounder
optional_env:
  - name: GROUNDER_API_KEY
    description: "A Grounder search key: one way to connect your account, used ahead of the sign-in when set"
    url: "https://grounder.net/account/keys"
    secret: true
  - name: GROUNDER_OAUTH_CLIENT_ID
    description: "For the sign-in: Grounder's public client for Hermes, not a secret. The plugin sets it to https://api.grounder.net/oauth/clients/hermes-agent at its first load, so there is nothing to set unless you point the sign-in at another Grounder"
    url: "https://github.com/grounder-labs/grounder-hermes-plugin#by-signing-in"
oauth:
  - id: grounder
    authorize_url: https://api.grounder.net/oauth/authorize
    token_url: https://api.grounder.net/oauth/token
    scopes: [search]
    client_id_env: GROUNDER_OAUTH_CLIENT_ID
    hosts: [api.grounder.net]
    authorize_params:
      resource: https://api.grounder.net/v1/search
