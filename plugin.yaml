name: grounder
version: 0.5.14
requires_hermes: ">=0.22.3"
license: Apache-2.0
description: "Licensed, live sources for Hermes Agent's `web_search` and `web_extract`. One call reaches the search providers a query needs (Exa, Brave, Tavily, Perplexity and more) and live data for scores, prices, odds and flights, and returns one deduplicated list. Every result is licensed: no site's robots.txt, license or AI opt-out refuses the provider that found it, and a search is never filled with unlicensed results. Free searches need no account. Connect your account for more, with a Grounder search key in `GROUNDER_API_KEY` or by signing in with `hermes auth add grounder:grounder`, which Hermes stores and refreshes; a connected account can choose a server with `/search` and a search mode with `/search_presets`. A `web_extract` counts as one search and returns what in each page answers the search that found it, or your latest message when no search did, at most 6,000 characters or the `char_limit` the model asks for up to 30,000. Installing makes Grounder this profile's `web_search` and `web_extract` backend the first time the plugin loads, replacing any backend already chosen for them once; `hermes tools` changes it back and that choice stands. Disclosure: each query and each page address you read is sent to api.grounder.net and recorded under your Grounder account, or with no account for a free search, and so is your latest message when a page no search found is read. `grounder_search` also sends the options the model chose, including a location or time zone only when the user stated one."
author: Grounder
kind: backend
provides_tools:
  - grounder_search
  - grounder_list_providers
provides_hooks:
  - transform_tool_result
  - transform_llm_output
  - pre_tool_call
  - post_api_request
  - pre_llm_call
provides_web_providers:
  - grounder
optional_env:
  - name: GROUNDER_API_KEY
    description: "A Grounder search key: one way to connect your account, used ahead of the sign-in when set"
    url: "https://grounder.net/account/keys"
    secret: true
  - name: GROUNDER_OAUTH_CLIENT_ID
    description: "For the sign-in: Grounder's public client for Hermes, not a secret. Set it to https://api.grounder.net/oauth/clients/hermes-agent"
    url: "https://github.com/grounder-labs/grounder-hermes-plugin#by-signing-in"
oauth:
  - id: grounder
    authorize_url: https://api.grounder.net/oauth/authorize
    token_url: https://api.grounder.net/oauth/token
    scopes: [search]
    client_id_env: GROUNDER_OAUTH_CLIENT_ID
    hosts: [api.grounder.net]
    authorize_params:
      resource: https://api.grounder.net/v1/search
