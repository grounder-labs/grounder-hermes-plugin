name: grounder
version: 0.7.6
requires_hermes: ">=0.22.3"
license: Apache-2.0
description: "Licensed, live sources for Hermes Agent's `web_search` and `web_extract`. Each search makes one call to one search provider (Exa, Brave, Tavily, Perplexity and more), and asks the live-data APIs (scores, prices, odds, flights and more) beside it as you set each one: every call, never, or when Grounder decides the question needs it. It returns each source's own results. Every result is licensed: no site's robots.txt, license or AI opt-out refuses the provider that found it, and a search is never filled with unlicensed results. Free searches need no account. When they are used up, a wallet can pay for each search instead (x402): set `GROUNDER_X402_PRIVATE_KEY` to a wallet's private key, which pays only in USDC on Base and no more than `GROUNDER_X402_MAX_PER_SEARCH` dollars a search (0.05 unless you set it), and needs the `eth-account` package in the Python that runs Hermes. Connect your account for more, with a Grounder search key in `GROUNDER_API_KEY` or by signing in with `hermes auth add grounder:grounder`, which Hermes stores and refreshes; a connected account can choose how Grounder searches with `/search` (on Slack, `/hermes search`) from Grounder's three modes: Grounder optimized (Grounder picks the provider for your question; the default), a Grounder preset (Fast, Cheap, Live, Deep, Code or Balanced: Grounder picks the best provider for it) or Grounder direct (you pick one provider, and optionally one of its modes: the only search provider called, and what it finds is what you get, even when that is nothing), and sets each live-data API to Every call, Never or Grounder decides (the default), in every mode. Your choices are saved on your Grounder account, the same setting as the Routing page on grounder.net, so a change in either shows in the other; a search sends none of them, and what the model passes to `grounder_search` applies to that search alone, and your choice wins where you have one. `/search` opens one menu for all of it (Let Grounder pick, A preset, A provider, Live-data APIs, Done, each with a Back row), it is the plugin's only command, and it is registered only while Grounder is your web search backend (a switch made in `hermes tools` takes effect at the next start). Every mode returns the provider's own results, each uncut and not reranked, less any a site's rules refuse it. A `web_extract` counts as one search and returns each page's text as Grounder returns it, whole and uncut by this plugin, read for the question of the search that found it, or your latest message when no search did. Installing makes Grounder this profile's `web_search` and `web_extract` backend the first time the plugin loads, but only for the one of the two that has no backend chosen yet: a backend you already chose is left alone, and `hermes tools` changes it and that choice stands. Disclosure: each query and each page address you read is sent to api.grounder.net and recorded under your Grounder account, or with no account for a free search, and so is your latest message when a page no search found is read. `grounder_search` also sends the options the model chose, including a location or time zone only when the user stated one. With a wallet set, a free search Grounder answers with a request for payment is sent once more with a signed payment authorization, which names the wallet's address, the amount and the payee. Usage context is off by default: only when you turn it on (`hermes config set web.grounder.share_usage_context true`, then restart Hermes) does a search also carry two random tokens, one for the session and one for the prompt, and the name of the model that asked for it, which Grounder uses for usage reporting (which models run searches, how many searches a prompt takes). The `post_api_request` hook that learns the model is registered only while the setting is on."
author: Grounder
kind: backend
provides_tools:
  - grounder_search
  - grounder_list_providers
provides_hooks:
  - transform_tool_result
  - transform_llm_output
  - pre_tool_call
  - post_api_request  # registered only while web.grounder.share_usage_context is on (off unless set to true)
  - pre_llm_call
provides_web_providers:
  - grounder
optional_env:
  - name: GROUNDER_API_KEY
    description: "A Grounder search key: one way to connect your account, used ahead of the sign-in when set"
    url: "https://grounder.net/account/keys"
    secret: true
  - name: GROUNDER_OAUTH_CLIENT_ID
    description: "For the sign-in: Grounder's public client for Hermes, not a secret. The plugin sets it to https://api.grounder.net/oauth/clients/hermes-agent at its first load, so there is nothing to set unless you point the sign-in at another Grounder"
    url: "https://github.com/grounder-labs/grounder-hermes-plugin#by-signing-in"
  - name: GROUNDER_X402_PRIVATE_KEY
    description: "A wallet's private key, so the wallet pays for each search once Grounder's free searches are used up (x402). Off unless set. The plugin pays only USDC on Base, no more than GROUNDER_X402_MAX_PER_SEARCH a search, and signs with the eth-account package, which the Python that runs Hermes needs. Use a wallet that holds only what you are willing to spend"
    url: "https://github.com/grounder-labs/grounder-hermes-plugin#pay-per-search-with-a-wallet"
    secret: true
  - name: GROUNDER_X402_MAX_PER_SEARCH
    description: "The most one search may cost the wallet, in US dollars: a search that costs more is not paid. Defaults to 0.05"
    url: "https://github.com/grounder-labs/grounder-hermes-plugin#pay-per-search-with-a-wallet"
oauth:
  - id: grounder
    authorize_url: https://api.grounder.net/oauth/authorize
    token_url: https://api.grounder.net/oauth/token
    scopes: [search]
    client_id_env: GROUNDER_OAUTH_CLIENT_ID
    hosts: [api.grounder.net]
    authorize_params:
      resource: https://api.grounder.net/v1/search
